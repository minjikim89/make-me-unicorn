line = 27
severity = "P1"

# Safe counterparts in the same file are covered by strict scoring: a report on line 17
# (SafeLoader passed positionally), 37 (argument-array subprocess), 50 (bound parameter)
# or 67 (prose f-string) would show up as an unexpected line only if the rule fired at
# P0 on a new path; the line checks above pin the exact offending lines.
