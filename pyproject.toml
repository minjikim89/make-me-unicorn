[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "make-me-unicorn"
version = "0.9.2"
description = "A deterministic launch gate for AI coding agents: blocks commits with unverified webhooks, missing Supabase RLS, or leaked keys. Offline, no LLM."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Make Me Unicorn Contributors" }
]
keywords = ["ai-agents", "claude-code", "codex", "cursor", "gemini-cli", "git-hooks", "security", "static-analysis", "supabase", "stripe", "mcp", "saas", "launch-checklist"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/minjikim89/make-me-unicorn"
Repository = "https://github.com/minjikim89/make-me-unicorn"
Issues = "https://github.com/minjikim89/make-me-unicorn/issues"
Changelog = "https://github.com/minjikim89/make-me-unicorn/blob/main/CHANGELOG.md"

[project.optional-dependencies]
llm = [
  "anthropic>=0.40",
]
mcp = [
  "mcp>=1.27,<3",
]
validate = [
  "vaderSentiment>=3.3",
  "requests>=2.28",
]
dev = [
  "mypy>=1.8",
  "ruff>=0.6",
]
all = [
  "anthropic>=0.40",
  "mcp>=1.27,<3",
  "vaderSentiment>=3.3",
  "requests>=2.28",
  "mypy>=1.8",
  "ruff>=0.6",
]

[project.scripts]
mmu = "mmu_cli.cli:main"
make-me-unicorn = "mmu_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundled content (blueprints, prompts, launch kit, filled example) so the
# CLI and MCP server work from a plain `pip install` without a repo clone.
# Kept in sync by scripts/sync_packaged_data.py (CI runs it with --check).
mmu_cli = ["data/**/*.md"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Benchmark fixtures are deliberately flawed sample projects, not code of this repo.
extend-exclude = ["bench/fixtures"]

[tool.ruff.lint]
# Pin the rule set explicitly so lint results don't drift when a new ruff
# release changes its defaults (CI installs the latest ruff).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
